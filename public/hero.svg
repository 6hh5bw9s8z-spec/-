<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#e3d0c6"/>
      <stop offset="55%" stop-color="#cfbdb4"/>
      <stop offset="100%" stop-color="#ab9c94"/>
    </radialGradient>
    <radialGradient id="g2" cx="75%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#e8d5cb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8d5cb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#8c7d76" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#8c7d76" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d423d" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#4d423d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4d423d" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#g1)"/>
  <ellipse cx="1150" cy="850" rx="700" ry="520" fill="url(#g2)" filter="url(#soft)"/>
  <ellipse cx="260" cy="1020" rx="640" ry="460" fill="url(#g3)" filter="url(#soft)"/>
  <ellipse cx="480" cy="230" rx="520" ry="330" fill="#efe0d6" opacity="0.5" filter="url(#soft)"/>
  <rect width="1600" height="1200" fill="url(#vig)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.5"/>
</svg>
